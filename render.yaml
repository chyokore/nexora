services:
  - type: web
    name: nexora-api
    runtime: node
    rootDir: scripts/telegraph-smoke
    buildCommand: npm install --package-lock=false && npm run build
    startCommand: node dist/src/api-cli.js
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: CORS_ALLOWED_ORIGINS
        sync: false
